plugins {
    id 'fabric-loom' version '1.11.8'
    // Loom enables Kotlin metadata remapping only when this plugin is present.
    // Cobblemon uses reflective metadata even though the Dex itself is Java.
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = '0.1.0-alpha.1+mc1.21.1-cobblemon1.8.3'
group = 'br.com.shirokaidex'
base { archivesName = 'shirokai-dex' }

repositories {
    mavenCentral()
    maven { url = 'https://artefacts.cobblemon.com/releases/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'com.cobblemon:fabric:1.8.3+1.21.1'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
    // Match Cobblemon's dedicated-server development runtime (fabric/build.gradle.kts).
    minecraftServerLibraries 'com.ibm.icu:icu4j:71.1'
    implementation include('org.xerial:sqlite-jdbc:3.47.1.0')
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'net.luckperms:api:5.4'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
test { useJUnitPlatform() }
