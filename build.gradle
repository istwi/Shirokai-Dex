plugins {
    id 'fabric-loom' version '1.11.8'
    // Loom enables Kotlin metadata remapping only when this plugin is present.
    // Cobblemon uses reflective metadata even though the Dex itself is Java.
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = '0.2.0-alpha.7+mc1.21.1-cobblemon1.8.3'
group = 'br.com.shirokaidex'
base { archivesName = 'shirokai-dex' }

repositories {
    mavenCentral()
    // Official versioned GitHub artifact; optional API, no bundled dependency.
    ivy {
        url = 'https://github.com/Patbox/TextPlaceholderAPI/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule('eu.pb4', 'placeholder-api') }
    }
    maven { url = 'https://artefacts.cobblemon.com/releases/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'com.cobblemon:fabric:1.8.3+1.21.1'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
    // Match Cobblemon's dedicated-server development runtime (fabric/build.gradle.kts).
    minecraftServerLibraries 'com.ibm.icu:icu4j:71.1'
    implementation include('org.xerial:sqlite-jdbc:3.47.1.0')
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'net.luckperms:api:5.4'
    modCompileOnly('eu.pb4:placeholder-api:2.4.2+1.21') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
test { useJUnitPlatform() }

// Development-only probe for actual API parser/context/conflict tests; never packaged in the mod.
sourceSets {
    placeholderProbe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('placeholderProbeJar', Jar) {
    dependsOn tasks.named('compilePlaceholderProbeJava'), tasks.named('processPlaceholderProbeResources')
    from sourceSets.placeholderProbe.output
    archiveClassifier = 'placeholder-probe'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
}
