plugins {
    id 'fabric-loom' version '1.11.8'
    // Loom enables Kotlin metadata remapping only when this plugin is present.
    // Cobblemon uses reflective metadata even though the Dex itself is Java.
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
}

version = '0.3.0-alpha.5+mc1.21.1-cobblemon1.8.3'
group = 'br.com.shirokaidex'
base { archivesName = 'shirokai-dex' }

repositories {
    mavenCentral()
    // Official versioned GitHub artifact; optional API, no bundled dependency.
    ivy {
        url = 'https://github.com/Patbox/TextPlaceholderAPI/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule('eu.pb4', 'placeholder-api') }
    }
    maven { url = 'https://artefacts.cobblemon.com/releases/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'com.cobblemon:fabric:1.8.3+1.21.1'
    modImplementation 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
    // Match Cobblemon's dedicated-server development runtime (fabric/build.gradle.kts).
    minecraftServerLibraries 'com.ibm.icu:icu4j:71.1'
    implementation include('org.xerial:sqlite-jdbc:3.47.1.0')
    implementation 'com.google.code.gson:gson:2.10.1'
    compileOnly 'net.luckperms:api:5.4'
    modCompileOnly('eu.pb4:placeholder-api:2.4.2+1.21') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
test { useJUnitPlatform() }

// Development-only probe for actual API parser/context/conflict tests; never packaged in the mod.
sourceSets {
    placeholderProbe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('placeholderProbeJar', Jar) {
    dependsOn tasks.named('compilePlaceholderProbeJava'), tasks.named('processPlaceholderProbeResources')
    from sourceSets.placeholderProbe.output
    archiveClassifier = 'placeholder-probe'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
}

// Separate fixture mod for party/PC capacity and attribute inspection in disposable worlds.
sourceSets {
    pokemonProbe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('pokemonProbeJar', Jar) {
    dependsOn tasks.named('compilePokemonProbeJava'), tasks.named('processPokemonProbeResources')
    from sourceSets.pokemonProbe.output
    archiveClassifier = 'pokemon-probe'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
}

sourceSets {
    layoutProbe {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('layoutProbeJar', Jar) {
    dependsOn tasks.named('compileLayoutProbeJava'), tasks.named('processLayoutProbeResources')
    from sourceSets.layoutProbe.output
    archiveClassifier = 'layout-probe'
    destinationDirectory = layout.buildDirectory.dir('test-mods')
}

// Source archives are developer material, never candidates for Fabric mod discovery.
tasks.named('sourcesJar') { exclude 'fabric.mod.json' }

tasks.register('verifyModJar') {
    dependsOn tasks.named('remapJar'), tasks.named('remapSourcesJar')
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    inputs.file(tasks.named('remapSourcesJar').flatMap { it.archiveFile })
    doLast {
        def binary = tasks.named('remapJar').get().archiveFile.get().asFile
        new java.util.jar.JarFile(binary).withCloseable { jar ->
            def metadata = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getJarEntry('fabric.mod.json')))
            if (metadata.version != project.version.toString()) throw new GradleException('Packaged version mismatch')
            metadata.entrypoints.main.each { entrypoint ->
                def path = entrypoint.replace('.', '/') + '.class'
                def entry = jar.getJarEntry(path)
                if (entry == null) throw new GradleException("Missing compiled entrypoint: $path")
                def node = new org.objectweb.asm.tree.ClassNode()
                new org.objectweb.asm.ClassReader(jar.getInputStream(entry)).accept(node, 0)
                if (node.name != path - '.class' || node.version != 65 ||
                    !node.interfaces.contains('net/fabricmc/api/ModInitializer') ||
                    !node.methods.any { it.name == 'onInitialize' && it.desc == '()V' && (it.access & 1) != 0 }) {
                    throw new GradleException("Invalid Java 21 ModInitializer: $entrypoint")
                }
            }
            if (jar.manifest.mainAttributes.getValue('Fabric-Mapping-Namespace') != 'intermediary')
                throw new GradleException('Expected production intermediary namespace')
            if (jar.entries().toList().any { it.name.contains('/probe/') }) throw new GradleException('Test probe in production JAR')
            metadata.jars.each { if (jar.getJarEntry(it.file) == null) throw new GradleException("Missing nested dependency: ${it.file}") }
        }
        new java.util.jar.JarFile(tasks.named('remapSourcesJar').get().archiveFile.get().asFile).withCloseable { jar ->
            if (jar.getJarEntry('fabric.mod.json') != null) throw new GradleException('Source archive must not be discoverable as a mod')
        }
        logger.lifecycle("Verified production entrypoint and safe source archive: ${binary.name}")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyModJar') }

tasks.register('serverDistribution', Sync) {
    dependsOn tasks.named('verifyModJar')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into layout.buildDirectory.dir('server-mod')
    doLast {
        def jar = tasks.named('remapJar').get().archiveFile.get().asFile
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        new File(destinationDir, 'SHA256SUMS').text = hash + '  ' + jar.name + '\n'
    }
}
