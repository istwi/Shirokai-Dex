name: Publish authorized wiki alpha

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wiki-alpha-3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.2.0-alpha.3
      SOURCE_SHA: 47817bff13cdc3464ad926791233801a01354b54
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test exact authorized source
        run: ./gradlew --no-daemon build
      - name: Prepare verified assets and release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, xml.etree.ElementTree as ET, zipfile
          destination = Path('build/release')
          destination.mkdir()
          suites = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          assert sum(int(s.get('tests')) for s in suites) == 78
          assert all(int(s.get(k)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          version = '0.2.0-alpha.3+mc1.21.1-cobblemon1.8.3'
          jar = Path(f'build/libs/shirokai-dex-{version}.jar')
          sources = Path(f'build/libs/shirokai-dex-{version}-sources.jar')
          with zipfile.ZipFile(jar) as z:
              assert json.loads(z.read('fabric.mod.json'))['version'] == version
          for file in (jar, sources, Path('docs/validation/phase2-wiki.json')):
              shutil.copyfile(file, destination / file.name)
          provenance = {
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'java': '21', 'junit_passed': 78,
              'runtime_validation': 'phase2-wiki.json records development server tests of this source (8 wiki, 9 collections, 12 foundation); its local JAR checksum is separate from this CI build.',
              'limitations': ['No visual Minecraft client or load test', 'This alpha not tested installed outside Loom', 'Spawn data unavailable; verified shiny captures remain unavailable']
          }
          (destination / 'BUILD_PROVENANCE.json').write_text(json.dumps(provenance, indent=2) + '\n')
          files = sorted(destination.iterdir())
          (destination / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          Path('build/release-notes.md').write_text('''Alpha experimental para Minecraft 1.21.1, Fabric, Java 21 e Cobblemon 1.8.3.

          Wiki por coleção com pesquisa, filtros de progresso, ordenação, paginação e detalhes de formas/tipos.
          Use /dex national wiki ou /dex national wiki pikachu; também disponível pelo botão na coleção.

          Instale somente shirokai-dex-0.2.0-alpha.3+mc1.21.1-cobblemon1.8.3.jar em mods.
          O arquivo -sources.jar é código-fonte e não deve ser instalado.
          Dependências: Fabric Loader 0.17.2+, Fabric API 0.116.6+1.21.1, Cobblemon 1.8.3+1.21.1 e Fabric Language Kotlin 1.13.6+kotlin.2.2.20. LuckPerms é opcional, exigido para coleções restritas e reload administrativo.

          Validação: 78 testes JUnit no build de publicação; 8 checks de wiki, 9 de coleções e 12 de fundação em servidor de desenvolvimento real, registrados no relatório anexado.
          Limites: sem validação visual/carga ou nova instalação desta alpha fora do Loom. Spawn e captura shiny verificada permanecem indisponíveis. Não é release estável.
          Consulte SHA256SUMS.txt e BUILD_PROVENANCE.json para checksums, commit e origem dos binários.
          ''')
          PY
      - name: Create or resume only this experimental draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish > /tmp/release.json; then
            python3 - <<'PY'
          import json, os
          r = json.load(open('/tmp/release.json'))
          assert r['isDraft'] and r['isPrerelease'], 'Refusing to modify a published release'
          assert r['targetCommitish'] == os.environ['SOURCE_SHA'], 'Draft target differs from authorized source'
          PY
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --prerelease --title 'Shirokai Dex 0.2.0-alpha.3 — Wiki de espécies' --notes-file build/release-notes.md
          fi
      - name: Upload assets without replacing existing bytes then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > /tmp/assets.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, tempfile
          existing = {x['name'] for x in json.load(open('/tmp/assets.json'))['assets']}
          for file in sorted(Path('build/release').iterdir()):
              if file.name in existing:
                  with tempfile.TemporaryDirectory() as directory:
                      subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'], '--pattern', file.name, '--dir', directory], check=True)
                      assert hashlib.sha256((Path(directory) / file.name).read_bytes()).digest() == hashlib.sha256(file.read_bytes()).digest(), 'Existing draft asset differs; refusing overwrite'
              else:
                  subprocess.run(['gh', 'release', 'upload', os.environ['RELEASE_TAG'], str(file)], check=True)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
