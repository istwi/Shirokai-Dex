name: Build Java 21 (experimental)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile, test and build remapped JAR
        run: ./gradlew --no-daemon clean build serverDistribution
      - name: Upload installable server mod only
        uses: actions/upload-artifact@v4
        with:
          name: shirokai-dex-alpha-mc1.21.1-cobblemon1.8.3-${{ github.sha }}
          path: build/server-mod/*
          if-no-files-found: error
      - name: Download published artifact for integrity check
        uses: actions/download-artifact@v4
        with:
          name: shirokai-dex-alpha-mc1.21.1-cobblemon1.8.3-${{ github.sha }}
          path: build/downloaded-server-mod
      - name: Verify published JAR matches the inspected build
        run: |
          diff build/server-mod/SHA256SUMS build/downloaded-server-mod/SHA256SUMS
          cd build/downloaded-server-mod
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.sha }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
