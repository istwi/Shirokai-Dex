name: Publish foundation alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.1.0-alpha.1
      SOURCE_SHA: c11b3660aaf567d161b03ac91c32d9d1de2501af
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing experimental draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('/tmp/release.json'))
          assert r['isDraft'] and r['isPrerelease'], 'Only the existing experimental draft may be published'
          assert r['targetCommitish'] == os.environ['SOURCE_SHA'], 'Release target differs from tested foundation'
          PY
      - name: Build and test exact release source
        run: ./gradlew --no-daemon build
      - name: Prepare assets, checksums and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, xml.etree.ElementTree as ET
          destination = Path('build/release')
          destination.mkdir()
          suites = [ET.parse(p).getroot() for p in Path('build/test-results/test').glob('TEST-*.xml')]
          assert sum(int(s.get('tests')) for s in suites) == 20
          assert all(int(s.get('failures')) == 0 and int(s.get('errors')) == 0 and int(s.get('skipped')) == 0 for s in suites)
          jars = sorted(Path('build/libs').glob('shirokai-dex-*.jar'))
          assert len(jars) == 2
          for jar in jars:
              shutil.copyfile(jar, destination / jar.name)
          shutil.copyfile('docs/validation/phase1-foundation.json', destination / 'phase1-foundation.json')
          provenance = {
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'java': '21', 'junit_passed': 20,
              'runtime_validation': 'See phase1-foundation.json for local server tests of the same implementation. Its local JAR checksum is separate from this CI build.'
          }
          (destination / 'BUILD_PROVENANCE.json').write_text(json.dumps(provenance, indent=2) + '\n')
          files = sorted(destination.iterdir())
          (destination / 'SHA256SUMS.txt').write_text(''.join(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - name: Upload all assets then publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" build/release/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
